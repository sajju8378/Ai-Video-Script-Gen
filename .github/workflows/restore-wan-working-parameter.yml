name: Restore known-working Wan parameter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Wan parameter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = '3,16,true,true];const r=await fetch(hfBase(env)+"/gradio_api/call/generate_video"'
          new = '3,16,false,true];const r=await fetch(hfBase(env)+"/gradio_api/call/generate_video"'
          if old not in s:
              raise SystemExit('Expected Wan parameter sequence not found; refusing to change anything.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js
          git commit -m 'Restore known-working Wan parameter [skip ci]'
          git push