name: Fix script validation initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix script validation initialization') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize validation on page load
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.js')
          s = p.read_text()
          old = 'document.getElementById("script").addEventListener("input",validateScript)'
          new = old + '\nvalidateScript()'
          if 'validateScript()' not in s.split(old, 1)[-1][:100]:
              if old not in s:
                  raise SystemExit('Expected validation listener not found')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix script validation initialization"
          git push
