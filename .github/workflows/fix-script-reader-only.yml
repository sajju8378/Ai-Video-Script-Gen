name: Fix script reader only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only script reader and parser corruption
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()

          def replace_between(text, start_marker, end_marker, replacement):
              a = text.find(start_marker)
              if a < 0:
                  raise SystemExit('Target start not found: ' + start_marker)
              b = text.find(end_marker, a)
              if b < 0:
                  raise SystemExit('Target end not found: ' + end_marker)
              return text[:a] + replacement + text[b:]

          words_new = """function words(t){var s=String(t||'').trim();return s?s.split(/\\s+/).filter(Boolean).length:0}\n"""
          s = replace_between(s, 'function words(t){', 'function esc(t){', words_new)

          split_new = """function splitScenes(text){var s=String(text||'').replace(/\\r/g,'').trim();if(!s)return[];var blocks=s.split(/\\n\\s*\\n+/).map(function(x){return x.trim()}).filter(Boolean);if(blocks.length>1)return blocks;var sentences=s.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[s],out=[],buf='',cue=/\\b(suddenly|later|meanwhile|finally|then|afterwards|after that|next morning|that night|the next day|outside|inside|near)\\b/i;function flush(){if(buf.trim()){out.push(buf.trim());buf=''}}sentences.forEach(function(raw,i){var x=raw.trim();if(i>0&&cue.test(x)){flush();buf=x;return}var c=(buf?buf+' ':'')+x;if(words(c)>45){flush();buf=x}else buf=c});flush();return out.length?out:[s]}\n"""
          s = replace_between(s, 'function splitScenes(text){', 'function durationFor(t){', split_new)

          sse_new = """function parseSSEBlock(block){var event='message',dataLines=[];block.split(/\\r?\\n/).forEach(function(line){if(line.indexOf('event:')===0)event=line.slice(6).trim();else if(line.indexOf('data:')===0)dataLines.push(line.slice(5).trim())});var raw=dataLines.join('\\n');if(!raw)return{event:event,data:null};if(raw==='null')return{event:event,data:null};try{return{event:event,data:JSON.parse(raw)}}catch{return{event:event,data:raw}}}\n"""
          s = replace_between(s, 'function parseSSEBlock(block){', 'async function waitForVideo(eventId,status){', sse_new)

          marker = "    var blocks=buffer.split("
          a = s.find(marker)
          if a < 0:
              raise SystemExit('Wan stream buffer parser target not found; refusing to change anything else.')
          b = s.find(';', a)
          if b < 0:
              raise SystemExit('Wan stream buffer parser terminator not found; refusing to change anything else.')
          s = s[:a] + "    var blocks=buffer.split(/\\r?\\n\\r?\\n/);" + s[b+1:]

          p.write_text(s)
          PY
      - name: Commit surgical fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Repair script reader without changing Wan request logic'
          git push
