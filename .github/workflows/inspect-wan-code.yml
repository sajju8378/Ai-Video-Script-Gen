name: Inspect Wan code
on:
  push:
    branches: [main]
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[inspect-wan]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Wan-related code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/app.js').read_text()
          for needle in ['streamVideo','Wan stream ended without a video file','/gradio_api/call/generate_video']:
              i=s.find(needle)
              print('\n===',needle,'index',i,'===')
              if i>=0: print(s[max(0,i-2500):i+4500])
          PY
