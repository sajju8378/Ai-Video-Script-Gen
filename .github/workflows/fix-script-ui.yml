name: Fix script UI only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only script validation UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = "<div id=\\\"count\\\" class=\\\"status bad\\\">0 words — 1 required</div>"
          new = "<div id=\\\"count\\\" class=\\\"status bad\\\" style=\\\"display:none\\\"></div>"
          if old in s:
              s = s.replace(old, new, 1)
          old = "<div id=\\\"devStatus\\\" class=\\\"status\\\">Type at least 20 words.</div>"
          new = "<div id=\\\"devStatus\\\" class=\\\"status\\\">Enter your script to continue.</div>"
          if old in s:
              s = s.replace(old, new, 1)
          old = "Please enter your script before developing scenes. Current count: '+n+'.'"
          new = "Please enter your script before developing scenes.'"
          if old in s:
              s = s.replace(old, new, 1)
          old = "else devStatus.textContent='Enter your script to continue.}"
          new = "else devStatus.textContent='Enter your script to continue.';}"
          if old not in s:
              raise SystemExit('Expected script-validation syntax was not found; refusing to change anything else.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix script input validation without touching Wan code'
          git push
