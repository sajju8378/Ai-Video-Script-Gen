name: Final Wan stream result fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Wan stream result handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old_extract = """function extractPath(v){if(v==null)return null;if(typeof v==='string'){var s=v.trim();if((s[0]==='{'||s[0]==='[')&&s.length<200000){try{return extractPath(JSON.parse(s))}catch{}}if(s.indexOf('/gradio_api/file=')>=0){var m=s.match(/https?:\\/\\/[^\\s\"']+\\/gradio_api\\/file=[^\\s\"']+|\\/gradio_api\\/file=[^\\s\"']+/);return m?m[0]:null}if(/^https?:\\/\\//.test(s)&&/\\.(mp4|webm|mov)(\\?|$)/i.test(s))return s;return null}if(Array.isArray(v)){for(var i=0;i<v.length;i++){var a=extractPath(v[i]);if(a)return a}return null}if(typeof v==='object'){if(typeof v.url==='string'&&v.url)return extractPath(v.url);if(typeof v.path==='string'&&v.path){var p=v.path.trim();if(p.indexOf('/gradio_api/file=')>=0)return extractPath(p);if(p.startsWith('/'))return '/gradio_api/file='+encodeURIComponent(p)}for(var k in v){var b=extractPath(v[k]);if(b)return b}}return null}"""
          new_extract = """function extractPath(v){if(v==null)return null;if(typeof v==='string'){var s=v.trim();if((s[0]==='{'||s[0]==='[')&&s.length<200000){try{return extractPath(JSON.parse(s))}catch{}}if(s.indexOf('/gradio_api/file=')>=0){var m=s.match(/https?:\\/\\/[^\\s\"']+\\/gradio_api\\/file=[^\\s\"']+|\\/gradio_api\\/file=[^\\s\"']+/);return m?m[0]:null}if(/^https?:\\/\\//.test(s)&&/\\.(mp4|webm|mov)(\\?|$)/i.test(s))return s;if(/^\\/.test(s)&&/\\.(mp4|webm|mov)(\\?|$)/i.test(s))return '/gradio_api/file='+encodeURIComponent(s);return null}if(Array.isArray(v)){for(var i=0;i<v.length;i++){var a=extractPath(v[i]);if(a)return a}return null}if(typeof v==='object'){if(typeof v.url==='string'&&v.url)return extractPath(v.url);if(typeof v.path==='string'&&v.path){var p=v.path.trim();if(p.indexOf('/gradio_api/file=')>=0)return extractPath(p);if(p.startsWith('/')&&/\\.(mp4|webm|mov)(\\?|$)/i.test(p))return '/gradio_api/file='+encodeURIComponent(p)}for(var k in v){var b=extractPath(v[k]);if(b)return b}}return null}"""
          if old_extract not in s:
              raise SystemExit('extractPath target not found')
          s = s.replace(old_extract, new_extract, 1)
          start = s.index('async function waitForVideo(')
          end = s.index('async function generateScene(', start)
          new_wait = r'''async function waitForVideo(eventId,status){
  if(!eventId)throw Error('Missing Wan event id');
  var r=await fetch('/api/wan/stream?eventId='+encodeURIComponent(eventId)+'&ts='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('Wan stream HTTP '+r.status);
  if(!r.body)throw Error('Wan stream returned no body');
  var reader=r.body.getReader(),decoder=new TextDecoder(),buffer='',lastProgress='';
  function handle(block){
    if(!block||!block.trim())return null;
    var e=parseSSEBlock(block);
    if(e.event==='error'){
      if(e.data===null)return null;
      var msg=typeof e.data==='string'?e.data:JSON.stringify(e.data);
      if(msg&&msg!=='null')throw Error('Wan generation error: '+msg);
      return null;
    }
    var path=extractPath(e.data);
    if(path)return path;
    if(e.event==='complete'||e.event==='completed')return null;
    if(e.data!==null){
      var text=typeof e.data==='string'?e.data:JSON.stringify(e.data);
      if(text&&text!=='null'&&text!==lastProgress){lastProgress=text;status.textContent='Wan 2.2 is generating... '+text.slice(0,180)}
    }
    return null;
  }
  while(true){
    var part=await reader.read();
    if(part.done)break;
    buffer+=decoder.decode(part.value,{stream:true});
    var blocks=buffer.split(/\\r?\\n\\r?\\n/);
    buffer=blocks.pop()||'';
    for(var i=0;i<blocks.length;i++){var found=handle(blocks[i]);if(found)return found;}
  }
  buffer+=decoder.decode();
  var tail=handle(buffer);if(tail)return tail;
  throw Error('Wan stream ended without a video file. The job may have failed on Hugging Face.');
}
'''
          s = s[:start] + new_wait + s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js .github/workflows/fix-wan-stream-final.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Wan stream video result detection [skip ci]'
          git push
