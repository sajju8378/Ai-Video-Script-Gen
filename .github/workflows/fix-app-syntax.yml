name: Fix app syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing closing brace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          old = "return json({ok:false,error:e?.message||String(e)},500)}};"
          new = "return json({ok:false,error:e?.message||String(e)},500)}}};"
          if old not in s:
              raise SystemExit('Target syntax not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Worker syntax error [skip ci]'
          git push
